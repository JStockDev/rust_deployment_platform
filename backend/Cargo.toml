[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# RT
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }

# Web
axum = "0.8.9"
openidconnect = "4.0.1"
reqwest = "0.13.5"

# Crypto
hmac = "0.13.0"
sha2 = "0.11.0"

# Time
time = { version = "0.3.55", features = ["serde"] }

# Serialisation
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

uuid = "1.28.0"
base64 = "0.23.1"

# Development
dotenvy = "0.15.7"
