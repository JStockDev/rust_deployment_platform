[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# RT
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }

# Web
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
openid = "0.25.0"
reqwest = "0.13.5"

# Crypto
hmac = "0.13.0"
sha2 = "0.11.0"

# Time
time = { version = "0.3.55", features = ["serde"] }

# Serialisation
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

uuid = { version = "1.28.0", features = ["v4", "serde"] }
base64 = "0.23.1"

# Development
dotenvy = "0.15.7"
redis = { version = "1.7.1", features = ["tokio-comp"] }
rand = { version = "0.10.3", features = ["std_rng"] }
